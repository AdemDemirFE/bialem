<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="tr">
  <head>
    <title th:text="#{email.activation.title}">Bialem hesap oluşturma</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
  </head>
  <body>
    <p th:text="#{email.activation.greeting(${user.login})}">Merhaba,</p>
    <p th:text="#{email.creation.text1}">Bialem hesabınız oluşturuldu. Erişmek için aşağıdaki bağlantıyı kullanabilirsiniz:</p>
    <p>
      <a th:with="url=(@{|${baseUrl}/reset-password?key=${resetKey}|})" th:href="${url}" th:text="${url}">Login link</a>
    </p>
    <p>
      <span th:text="#{email.activation.text2}">Saygılarımızla,</span>
      <br />
      <em th:text="#{email.signature}">Bialem</em>
    </p>
  </body>
</html>
