# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.bialem.backend: DEBUG

spring:
  application:
    name: bialem
  # Optional local secrets (gitignored). Create from docs / paste App Password there.
  config:
    import: optional:classpath:config/application-mail-local.yml
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file:
        - src/main/docker/services.yml
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # Local Docker Postgres only (host 15432). Never point this at production.
    url: jdbc:postgresql://localhost:15432/bialem
    username: bialem
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    contexts: dev
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    # username/password: env (MAIL_*) or gitignored application-mail-local.yml
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:acbaldirlioglu@gmail.com}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

server:
  port: 8080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  cache: # Cache configuration
    ehcache: # Ehcache configuration
      time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
      max-entries: 100 # Number of objects in each cache entry
  # CORS is only enabled by default with the "dev" profile
  cors:
    # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
    allowed-origins: 'http://localhost:8100,https://localhost:8100,http://localhost:9000,https://localhost:9000,http://localhost:4200,https://localhost:4200,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5199,http://localhost:4173,capacitor://localhost,http://localhost'
    # Enable CORS when running in GitHub Codespaces
    allowed-origin-patterns: 'https://*.githubpreview.dev'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        base64-secret: ODQ2MThkMjk3ZjJkMzFiYTBjZmU5ZjNmZDAxMTNjYzVjMjg1ZjI2NTRmYjgyNWE2NGU4MzcyOTJlNmUyNmQ2NzU4ZWEwOWU5ZWRkNDNkZGQ1MWYwMmMzZDQ5MDY2NzU3N2ZkMzE4MGM1ZmVjNzU4M2M5M2Y2MDkxZjgwNWVkNjI=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  mail: # specific JHipster mail property, for standard properties see MailProperties
    base-url: ${JHIPSTER_MAIL_BASE_URL:${FRONTEND_URL:http://localhost:5173}}
    from: ${SPRING_MAIL_FROM:${MAIL_FROM:acbaldirlioglu@gmail.com}}
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
