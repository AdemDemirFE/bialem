server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    # Optional same-origin API proxy. The built web app targets the absolute
    # VITE_API_BASE_URL (https://api.bialem.app), so this is only a fallback
    # when that value is emptied/relative. Backend container resolves on
    # bialem-network.
    location /api/ {
        proxy_pass http://bialem-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /management/health {
        proxy_pass http://bialem-backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}