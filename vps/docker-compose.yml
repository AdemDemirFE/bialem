name: bialem

# Bialem VPS package - docker-compose
# Prebuilt artifacts are mounted from this folder (no docker build needed on the server):
#   backend/bialem-backend.jar       Spring Boot fat JAR (prod)
#   frontend/dist/                   Vite web build (nginx static)
#   admin/                           Next.js standalone output (node)
#
# Usage:  docker compose --env-file .env.prod up -d   (or: bash scripts/deploy.sh)

services:
  db:
    image: postgres:17.4
    container_name: bialem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bialem-postgres-data:/var/lib/postgresql/data
    networks:
      - bialem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No host ports. Reachable only as bialem-db:5432 on bialem-network.

  backend:
    image: eclipse-temurin:17-jre-alpine
    container_name: bialem-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/bialem-backend.jar:/app/app.jar:ro
      - ${FIREBASE_CREDENTIALS_FILE:-./secrets/firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_LIQUIBASE_URL: ${SPRING_LIQUIBASE_URL}
      SPRING_LIQUIBASE_USER: ${SPRING_LIQUIBASE_USER}
      SPRING_LIQUIBASE_PASSWORD: ${SPRING_LIQUIBASE_PASSWORD}
      JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JHIPSTER_MAIL_BASE_URL: ${JHIPSTER_MAIL_BASE_URL}
      JHIPSTER_CORS_ALLOWED_ORIGINS: ${JHIPSTER_CORS_ALLOWED_ORIGINS}
      JHIPSTER_CORS_ALLOWED_ORIGIN_PATTERNS: ${JHIPSTER_CORS_ALLOWED_ORIGIN_PATTERNS}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-25}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-/secrets/firebase-service-account.json}
    command: ["sh", "-c", "exec java -Xms256m -Xmx512m -Djava.security.egd=file:/dev/./urandom -jar /app/app.jar"]
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    networks:
      - bialem-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/management/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  frontend:
    image: nginx:1.27-alpine
    container_name: bialem-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4174}:80"
    networks:
      - bialem-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    image: node:22-alpine
    container_name: bialem-admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./admin:/app
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${ADMIN_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.bialem.app}
      NEXT_PUBLIC_APP_ENV: prod
    command: ["node", "admin/server.js"]
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    networks:
      - bialem-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  bialem-network:
    name: bialem-network
    driver: bridge

volumes:
  bialem-postgres-data:
    name: bialem-postgres-data