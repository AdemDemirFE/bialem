# ============================================================================
# BIALEM BACKEND — PRODUCTION DOCKER COMPOSE
# ============================================================================
# Usage:
#   cd deploy
#   cp config.env.example config.env   # Edit with your values
#   docker compose -f docker-compose.prod.yml --env-file config.env up -d
#
# Mobile apps connect to this backend at https://your-domain.com
# ============================================================================

name: bialem

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────
  postgresql:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bialem}
      POSTGRES_USER: ${POSTGRES_USER:-bialem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config.env}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bialem} -d ${POSTGRES_DB:-bialem}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # In production, PostgreSQL is NOT exposed to the host.
    # The backend connects via Docker internal network.
    networks:
      - bialem-net

  # ─── Bialem Backend ─────────────────────────────────────────────────
  app:
    image: bialem:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx512m}
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bialem}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-bialem}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bialem}
      - SPRING_LIQUIBASE_USER=${POSTGRES_USER:-bialem}
      - SPRING_LIQUIBASE_PASSWORD=${POSTGRES_PASSWORD}
      # JWT (REQUIRED)
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      # Mail
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@bialem.app}
      # Frontend / CORS
      - FRONTEND_URL=${FRONTEND_URL:-https://bialem.app}
      - JHIPSTER_CORS_ALLOWED_ORIGINS=${JHIPSTER_CORS_ALLOWED_ORIGINS:-https://bialem.app,https://www.bialem.app,http://localhost,capacitor://localhost}
      - JHIPSTER_CORS_ALLOWED_ORIGIN_PATTERNS=${JHIPSTER_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,https://localhost:*}
      # Firebase
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-/app/config/firebase-service-account.json}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      # Payment
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-MOCK}
      - PAYMENT_API_KEY=${PAYMENT_API_KEY:-}
      - PAYMENT_SECRET_KEY=${PAYMENT_SECRET_KEY:-}
      - PAYMENT_BASE_URL=${PAYMENT_BASE_URL:-https://sandbox-api.iyzipay.com}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      # API Docs
      - SPRINGDOC_SWAGGER_UI_ENABLED=${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      - SPRINGDOC_API_DOCS_ENABLED=${SPRINGDOC_API_DOCS_ENABLED:-false}
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:-false}
    volumes:
      - app_data:/app/data
      # Mount Firebase credentials file (optional)
      # - ${FIREBASE_CREDENTIALS_PATH:-./config/firebase-service-account.json}:/app/config/firebase-service-account.json:ro
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/management/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - bialem-net

  # ─── (Optional) Nginx reverse proxy for TLS termination ──────────────
  # Uncomment and configure for HTTPS if not using external load balancer
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   depends_on:
  #     - app
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   networks:
  #     - bialem-net

volumes:
  postgresql_data:
    driver: local
  app_data:
    driver: local

networks:
  bialem-net:
    driver: bridge
